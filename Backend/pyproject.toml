[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-interviewer-backend"
version = "0.1.0"
description = "AI Interviewer / placement preparation platform - M20 Course Viva"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "sqlmodel==0.0.22",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.20",
    # Text out of the material students add, page by page (spec §6.3).
    "pypdf>=5.0",
    "python-docx>=1.1",
    "python-pptx>=1.0",
    # Shared platform foundation, PINNED BY TAG like every module.
    "ai-core @ git+https://github.com/MNEMOS-PREP/Platform_Core@v0.38.0#subdirectory=python",
]

[project.optional-dependencies]
# The catalogue sync (jobs/sync_catalogue.py): a build step run when the
# university publishes, never a request path, so the API does not need these.
sync = [
    "beautifulsoup4>=4.12",
    # Pinned: 2.0 reads these tables differently (no rows for CSE 2023, titles
    # without spaces); 1.28.2 is what M04 parses the same PDFs with.
    "pymupdf==1.28.2",
]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "ruff>=0.6",
]

[tool.setuptools.packages.find]
include = ["backend_*"]
namespaces = false

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"**/router.py" = ["B008"]
# Fixtures are data: a catalogue row reads best on one line.
"**/tests/*.py" = ["E501"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["backend_M20_Course_Viva"]
markers = ["gate: release-blocking acceptance gate (spec §13)"]
